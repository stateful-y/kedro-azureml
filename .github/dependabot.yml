version: 2
# Python dependencies (pyproject.toml + uv.lock) are managed by Renovate (see renovate.json),
# which has first-class uv.lock support. Dependabot only handles GitHub Actions here.
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
